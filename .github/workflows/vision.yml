name: Local vision model integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/vision.yml'
permissions:
  contents: read
jobs:
  qwen-visual-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      ollama:
        image: ollama/ollama:0.13.5
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Load the same vision model offered by the editor
        run: |
          curl --retry 3 --fail-with-body http://localhost:11434/api/pull -d '{"model":"qwen3-vl:4b","stream":false}' | tee pull.json
          python -c "import json; assert json.load(open('pull.json'))['status']=='success'"
      - name: Find a requested shape and export the selected window
        run: |
          ffmpeg -v error -f lavfi -i "color=white:s=320x180:r=10:d=9" -vf "drawbox=x=100:y=30:w=120:h=120:c=red:t=fill:enable='between(t,3,5.99)'" -c:v libx264 fixture.mp4
          python -m clutchsift fixture.mp4 --mode ai --focus "A large red square is visible on a white background. A white screen alone is a non-match." --count 1 --seconds 3 --output results
          python -c "import json; c, = json.load(open('results/run-001/highlights.json'))['candidates']; print(c); assert c['start'] <= 4.5 < c['end'] and c['score'] >= 2 and c['evidence']"
          ffmpeg -v error -xerror -i results/run-001/clip_01.mp4 -f null -
